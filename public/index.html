<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AP3 - Aplikasi Penyusunan Penelitian Perkara</title>
  <style>
    #app-loading-screen {
      position: fixed;
      inset: 0;
      background: #0b192c;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      font-family: system-ui, -apple-system, sans-serif;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .loading-desc {
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
  <link rel="stylesheet" href="/style.0C2YAR2L.css">
</head>
<body id="app-root">

  <!-- Layar tunggu saat modul sedang dimuat -->
  <div id="app-loading-screen">
    <div class="spinner"></div>
    <div class="loading-title">AP3 SYSTEM</div>
    <div class="loading-desc" id="loadingText">Sedang menyiapkan modul dan memuat data...</div>
  </div>

  <!-- Cukup panggil 1 berkas hasil bundel -->
  
  <script type="module" src="/app.GDRCVWLO.js"></script>
</body>
</html>
